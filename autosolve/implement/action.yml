name: Autosolve Implement
description: Run Claude to implement a solution, validate changes, push to a fork, and create a PR.

inputs:
  claude_cli_version:
    description: "Claude CLI version to install (e.g. '2.1.79' or 'latest')."
    required: false
    default: "2.1.79"
  system_prompt:
    description: >
      Trusted instructions for Claude describing the task to implement.
      Do not embed untrusted user input (e.g., issue titles/bodies) here.
      Pass user-supplied data via environment variables and list them in context_vars.
    required: false
    default: ""
  skill:
    description: Path to a skill/prompt file relative to GITHUB_WORKSPACE.
    required: false
    default: ""
  context_vars:
    description: >
      Comma-separated list of environment variable names to pass through to Claude.
      Use this to provide untrusted user input (e.g., issue titles/bodies) safely.
      Claude is automatically told which variables are available and instructed to
      read them — you do not need to reference them in system_prompt.
      Claude will only have access to these variables plus a baseline set of
      system and authentication variables (PATH, HOME, etc.).
    required: false
    default: ""
  allowed_tools:
    description: Claude --allowedTools string.
    required: false
    default: "Read,Write,Edit,Grep,Glob,Bash(git add:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(make:*)"
  model:
    description: Claude model ID.
    required: false
    default: "claude-opus-4-6"
  max_retries:
    description: Maximum implementation attempts.
    required: false
    default: "3"
  pr_target_repo:
    description: >
      Repository where the PR is created (owner/repo format).
      Defaults to the repository running the workflow. Set this when the
      PR should target a different repository than the one triggering the action.
    required: false
    default: ${{ github.repository }}
  pr_base_branch:
    description: Base branch for the PR.
    required: false
    default: "main"
  pr_labels:
    description: Comma-separated labels to apply to the PR.
    required: false
    default: "autosolve"
  pr_draft:
    description: Whether to create the PR as a draft.
    required: false
    default: "true"
  fork_owner:
    description: GitHub username or org that owns the fork.
    required: false
    default: ""
  fork_repo:
    description: Repository name of the fork.
    required: false
    default: ""
  fork_push_token:
    description: PAT with push access to the fork.
    required: false
    default: ""
  pr_create_token:
    description: PAT with permission to create PRs on the upstream repo.
    required: false
    default: ""
  blocked_paths:
    description: >
      Comma-separated path prefixes that cannot be modified.
      .github/ is always blocked and cannot be removed.
    required: false
    default: ""
  git_user_name:
    description: Git author/committer name.
    required: false
    default: "autosolve[bot]"
  git_user_email:
    description: Git author/committer email.
    required: false
    default: "autosolve[bot]@users.noreply.github.com"
  branch_prefix:
    description: "Prefix for the branch name. The full branch is <prefix><suffix>."
    required: false
    default: "autosolve/"
  branch_suffix:
    description: Suffix for branch name (autosolve/<suffix>). Defaults to timestamp.
    required: false
    default: ""
  commit_signature:
    description: "Signature line appended to commit messages (e.g. Co-Authored-By)."
    required: false
    default: "Co-Authored-By: Claude <noreply@anthropic.com>"
  pr_footer:
    description: "Footer appended to the PR body."
    required: false
    default: "---\n\n*This PR was auto-generated by [claude-autosolve-action](https://github.com/cockroachdb/actions) using Claude Code.*\n*Please review carefully before approving.*"
  log_level:
    description: >
      Controls how much Claude output streams to the step log.
      "error" (default) logs only errors and final status (token counts, result).
      "info" adds the result summary (turns, duration, cost) and warns on
      permission denials.
      "debug" streams everything including all tool calls, assistant text,
      and tool I/O.
      Info and debug may contain source code snippets or environment
      variable values. Security review output is never logged regardless
      of this setting.
    required: false
    default: "error"
  working_directory:
    description: >
      Directory the action runs in, relative to GITHUB_WORKSPACE. Required.
      Must be a strict subdirectory of GITHUB_WORKSPACE — the workspace
      root itself is rejected because other actions (e.g.
      google-github-actions/auth) drop credential files there. Check the
      target repo out into a subdirectory like ./repo and set
      working_directory to that path. This directory is the only
      caller-controlled writable location bound into the bubblewrap
      sandbox; Claude additionally gets a private writable /tmp
      (tmpfs, discarded after the run).
    required: true
  read_paths:
    description: >
      Comma-separated extra host paths (files or directories) to bind
      read-only into the sandbox. Use for shared schemas, generated
      protos, or other references the task needs to consult but not
      modify. Paths may be absolute or relative to GITHUB_WORKSPACE.
      The file referenced by GOOGLE_APPLICATION_CREDENTIALS, if set,
      is auto-bound and does not need to be listed here.
    required: false
    default: ""

outputs:
  status:
    description: SUCCESS or FAILED
    value: ${{ steps.implement.outputs.status }}
  pr_url:
    description: URL of the created PR.
    value: ${{ steps.implement.outputs.pr_url }}
  summary:
    description: Human-readable summary.
    value: ${{ steps.implement.outputs.summary }}
  result:
    description: Full Claude result text.
    value: ${{ steps.implement.outputs.result }}
  branch_name:
    description: Name of the branch pushed to the fork.
    value: ${{ steps.implement.outputs.branch_name }}

runs:
  using: "composite"
  steps:
    - name: Set up sandbox
      shell: bash
      run: |
        if [[ "$RUNNER_OS" != "Linux" ]]; then
          echo "::error::autosolve requires Linux runners (the sandbox uses bubblewrap, which is Linux-only)"
          exit 1
        fi
        sudo apt-get update
        sudo apt-get install --yes bubblewrap
        # Ubuntu 24.04+ restricts unprivileged user namespaces by default,
        # which blocks bwrap's uid mapping. Disabling this on an ephemeral
        # hosted runner is acceptable; persistent self-hosted runners
        # should evaluate the tradeoff before adopting this action.
        sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
        mkdir -p "$RUNNER_TEMP/autosolve-scratch/home"

    - name: Set up Claude CLI
      shell: bash
      run: |
        if command -v roachdev >/dev/null; then
          printf '#!/bin/sh\nexec roachdev claude -- "$@"\n' > /usr/local/bin/claude
          chmod +x /usr/local/bin/claude
          echo "Claude CLI: using roachdev wrapper ($(roachdev version))"
        else
          curl --fail --silent --show-error --location https://claude.ai/install.sh | bash -s -- "$CLAUDE_CLI_VERSION"
          echo "Claude CLI installed: $(claude --version)"
        fi
      env:
        CLAUDE_CLI_VERSION: ${{ inputs.claude_cli_version }}

    - name: Check for existing build
      id: check-build
      shell: bash
      run: |
        if [ -x "$RUNNER_TEMP/autosolve" ]; then
          echo "skip_build=true" >> "$GITHUB_OUTPUT"
          echo "autosolve binary already available, skipping Go setup and build"
        elif command -v go >/dev/null; then
          echo "skip_go=true" >> "$GITHUB_OUTPUT"
          echo "Go already available ($(go version)), skipping setup-go"
        fi

    - name: Set up Go
      if: steps.check-build.outputs.skip_build != 'true' && steps.check-build.outputs.skip_go != 'true'
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false

    - name: Build autosolve
      if: steps.check-build.outputs.skip_build != 'true'
      shell: bash
      run: go build -trimpath -o "$RUNNER_TEMP/autosolve" ./cmd/autosolve
      working-directory: ${{ github.action_path }}/..

    - name: Run implementation
      id: implement
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: $RUNNER_TEMP/autosolve implement
      env:
        SCRIPTS_DIR: ${{ github.action_path }}/../scripts
        INPUT_SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        INPUT_SKILL: ${{ inputs.skill }}
        INPUT_CONTEXT_VARS: ${{ inputs.context_vars }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        INPUT_MAX_RETRIES: ${{ inputs.max_retries }}
        INPUT_PR_TARGET_REPO: ${{ inputs.pr_target_repo }}
        INPUT_PR_BASE_BRANCH: ${{ inputs.pr_base_branch }}
        INPUT_PR_LABELS: ${{ inputs.pr_labels }}
        INPUT_PR_DRAFT: ${{ inputs.pr_draft }}
        INPUT_FORK_OWNER: ${{ inputs.fork_owner }}
        INPUT_FORK_REPO: ${{ inputs.fork_repo }}
        INPUT_FORK_PUSH_TOKEN: ${{ inputs.fork_push_token }}
        INPUT_PR_CREATE_TOKEN: ${{ inputs.pr_create_token }}
        INPUT_BLOCKED_PATHS: ${{ inputs.blocked_paths }}
        INPUT_GIT_USER_NAME: ${{ inputs.git_user_name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git_user_email }}
        INPUT_BRANCH_PREFIX: ${{ inputs.branch_prefix }}
        INPUT_BRANCH_SUFFIX: ${{ inputs.branch_suffix }}
        INPUT_COMMIT_SIGNATURE: ${{ inputs.commit_signature }}
        INPUT_PR_FOOTER: ${{ inputs.pr_footer }}
        INPUT_LOG_LEVEL: ${{ inputs.log_level }}
        INPUT_READ_PATHS: ${{ inputs.read_paths }}
